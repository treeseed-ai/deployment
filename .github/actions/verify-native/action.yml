name: Verify native owning candidate
description: Prepare the original disposable host and execute all owner prerequisites and existing component scenes.
runs:
  using: composite
  steps:
    - run: npm prune --ignore-scripts --no-audit --no-fund --workspaces=false
      shell: bash
    - name: Fetch exact existing Reviewer runner
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: treeseed-ai/reviewer
        ref: 001329f305c79beb6c1c8dfb9b85a36c6360e3eb
        path: .treeseed/tools/reviewer
    - name: Install the executing Reviewer suite dependencies
      run: npm ci --prefix .treeseed/tools/reviewer --ignore-scripts --no-audit --no-fund
      shell: bash
    - name: Measure the executing Reviewer prerequisite custody
      id: reviewer-prerequisites
      run: node --import ./.treeseed/tools/reviewer/node_modules/tsx/dist/loader.mjs .treeseed/tools/reviewer/scripts/scene-action-prerequisites.ts
      shell: bash
    - name: Install Reviewer native prerequisite toolchain
      if: steps.reviewer-prerequisites.outputs.toolchain-ready != 'true'
      uses: erlef/setup-beam@v1
      with:
        otp-version: 27.3.4.18
        elixir-version: 1.17.3
    - name: Install the executing Reviewer exact SDK artifact
      uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@8702e0285622276d850250a5f8637b6d704318d1
      env:
        NODE_ENV: production
      with:
        github-token: ${{ github.token }}
        commit: ${{ steps.reviewer-prerequisites.outputs.sdk-commit }}
        paths: .treeseed/tools/reviewer/node_modules/@treeseed/sdk
    - name: Build the executing Reviewer archive assets
      run: npm run --prefix .treeseed/tools/reviewer build:dist
      shell: bash
    - name: Reproduce executing Reviewer installed archives before full suites
      working-directory: .treeseed/tools/reviewer
      run: sudo --preserve-env=GITHUB_WORKSPACE,NPM_CONFIG_CACHE,PATH "$(command -v node)" node_modules/vitest/vitest.mjs run --config ./vitest.config.ts tests/integration/guarantees/installed-custody.test.ts -t '^executes actual production-installed Reviewer and owner archives and retains denied checkout imports and missing-helper failures before exact retry$'
      shell: bash
    - name: Build original capacity host installer
      run: npm run build:deb
      env:
        TREESEED_APT_SUITE: development
        TREESEED_INTEGRATION_RELEASES: https://raw.githubusercontent.com/treeseed-ai/platform/be36cd24299c0381a4e1c81c420823f6340ca136/config/integrations/stable.release.json,https://raw.githubusercontent.com/treeseed-ai/platform/be36cd24299c0381a4e1c81c420823f6340ca136/config/integrations/development.release.json
      shell: bash
    - name: Initialize disposable native capacity host
      run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_WORKSPACE,TREESEED_PRIVILEGED_CACHE_TESTS,NPM_CONFIG_CACHE,PATH "$(command -v node)" --import tsx scripts/verify-native-host.ts
      env:
        TREESEED_PRIVILEGED_CACHE_TESTS: "1"
      shell: bash
    - name: Prepare native development image before timed tests
      run: |
        node node_modules/tsx/dist/cli.mjs --eval '
          import {execFileSync} from "node:child_process";
          import {resolveDevelopmentRuntimeImage} from "./src/supervisor/development-container.ts";
          const image="mirror.gcr.io/library/node@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd";
          const docker=(args:readonly string[])=>execFileSync("/usr/bin/docker",[...args],{encoding:"utf8",stdio:["ignore","pipe","pipe"]});
          docker(["pull","--quiet",image]);
          const expected=docker(["image","inspect",image,"--format","{{.Id}}"]).trim();
          docker(["tag",image,"node:24-bookworm-slim"]);
          const resolved=resolveDevelopmentRuntimeImage((_executable:string,args:readonly string[])=>docker(args));
          if(resolved!==expected)throw new Error("Native development image readback differs from its held manifest.");
        '
      shell: bash
    - name: Reproduce public host inspection before the complete native suites
      run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE,TREESEED_PRIVILEGED_CACHE_TESTS,NPM_CONFIG_CACHE,PATH "$(command -v node)" node_modules/vitest/vitest.mjs run tests/sandbox-host-inspection-native.test.ts tests/warm-sandbox-pool.test.ts tests/sandbox-vm-custody.test.ts
      env:
        TREESEED_PRIVILEGED_CACHE_TESTS: "1"
      shell: bash
    - run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE,TREESEED_PRIVILEGED_CACHE_TESTS,NPM_CONFIG_CACHE,PATH bash -euo pipefail -c 'npm run verify:direct'
      env:
        TREESEED_PRIVILEGED_CACHE_TESTS: "1"
      shell: bash
    - name: Execute coded sandbox component scenes
      shell: bash
      run: |
        sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,TREESEED_PRIVILEGED_CACHE_TESTS,NPM_CONFIG_CACHE,PATH "$(command -v node)" --import ./.treeseed/tools/reviewer/node_modules/tsx/dist/loader.mjs \
          .treeseed/tools/reviewer/src/verifiers/guarantees/command.ts \
          --workspace "$GITHUB_WORKSPACE" --environment local --ids guarantee.deployment.golden.component-boundaries \
          --run-id "actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      env:
        TREESEED_PRIVILEGED_CACHE_TESTS: "1"
    - name: Retain coded scene evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: scene-evidence-${{ github.sha }}-${{ github.run_attempt }}
        path: .treeseed/guarantees/runs/actions-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
    - name: Return disposable npm cache to the packaging user
      run: |
        set -euo pipefail
        test "$NPM_CONFIG_CACHE" = "$GITHUB_WORKSPACE/.treeseed/npm-cache"
        sudo chown --no-dereference --recursive -- "$(id -u):$(id -g)" "$NPM_CONFIG_CACHE"
      shell: bash
