name: Identity compatibility
on:
  pull_request:
    paths: ['src/identity/**', 'src/postgres/**', 'src/supervisor/postgres*.ts', 'src/supervisor/backup*.ts', 'tests/identity-runtime/**', '.github/workflows/identity-acceptance.yml']
  push:
    branches: [staging, main]
    paths: ['src/identity/**', 'src/postgres/**', 'src/supervisor/postgres*.ts', 'src/supervisor/backup*.ts', 'tests/identity-runtime/**', '.github/workflows/identity-acceptance.yml']
permissions: { contents: read }
concurrency:
  group: identity-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  identity-runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.identity-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Check out the accepted API session implementation (disposable test only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: treeseed-ai/api
          ref: c440a479e3f50da1c47c3ac1d3f8f4081d11731f
          path: .fixtures/api
          persist-credentials: false
      - name: Build API independently for encrypted session acceptance
        working-directory: .fixtures/api
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - run: npm ci --prefix tests/identity-runtime --ignore-scripts --no-audit --no-fund
      - name: Install Deployment runtime dependencies used by shared database policy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the Deployment implementation exercised by acceptance
        run: npm run build
      - run: node tests/identity-runtime/node_modules/playwright/cli.js install --with-deps chromium
      - name: Resolve disposable TLS names only on this ephemeral runner
        run: echo '127.0.0.1 sovereign.localhost central.localhost' | sudo tee -a /etc/hosts
      - run: npx tsc -p tests/identity-runtime/tsconfig.json
      - name: Verify published CLI and real OS custody with Keycloak
        run: sudo --preserve-env=GITHUB_ACTIONS,PLAYWRIGHT_BROWSERS_PATH "$(command -v node)" --import tsx tests/identity-runtime/verify.ts > identity-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-acceptance-${{ github.sha }}
          path: |
            identity-acceptance.json
            identity-auth-desktop.png
            identity-auth-mobile.png
          retention-days: 14
          if-no-files-found: error
  postgres-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        source: [fresh, bookworm, alpine]
    env:
      TREESEED_POSTGRES_TRANSFER_SOURCE: ${{ matrix.source }}
    # Host custody deliberately requires systemd >=259 (--refuse-null), matching
    # the supported Ubuntu 26.04 host, not the older browser-fixture runner.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Type-check privileged acceptance fixtures
        run: npx tsc --noEmit --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --skipLibCheck --target ES2023 --module NodeNext --moduleResolution NodeNext tests/identity-runtime/local-bootstrap.ts tests/identity-runtime/managed-transfer.ts
      - name: Verify protected local bootstrap without a host TCP port
        run: sudo --preserve-env=GITHUB_ACTIONS,TREESEED_POSTGRES_TRANSFER_SOURCE "$(command -v node)" --import tsx tests/identity-runtime/local-bootstrap.ts > postgres-bootstrap-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-bootstrap-acceptance-${{ matrix.source }}-${{ github.sha }}
          path: postgres-bootstrap-acceptance.json
          retention-days: 14
          if-no-files-found: error
