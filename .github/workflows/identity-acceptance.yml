name: Identity compatibility
on:
  pull_request:
    paths: ['src/identity/**', 'src/postgres/**', 'tests/identity-runtime/**', '.github/workflows/identity-acceptance.yml']
  push:
    branches: [staging, main]
    paths: ['src/identity/**', 'src/postgres/**', 'tests/identity-runtime/**', '.github/workflows/identity-acceptance.yml']
permissions: { contents: read }
concurrency:
  group: identity-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  identity-runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.identity-browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Check out the accepted API session implementation (disposable test only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: treeseed-ai/api
          ref: be33a6e5d1f0cc364c76fcf1b4c30609616c5373
          path: .fixtures/api
          persist-credentials: false
      - name: Build API independently for encrypted session acceptance
        working-directory: .fixtures/api
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - run: npm ci --prefix tests/identity-runtime --ignore-scripts --no-audit --no-fund
      - name: Install Deployment runtime dependencies used by shared database policy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify exact Identity candidate before publication (disposable only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: treeseed-ai/identity
          ref: 48aacd6a73169be9d656aeb349f94f32d49d356b
          path: .fixtures/identity
          persist-credentials: false
      - name: Build and install candidate in both disposable dependency roots
        run: |
          npm ci --prefix .fixtures/identity --ignore-scripts --no-audit --no-fund
          npm run build --prefix .fixtures/identity
          npm pack ./.fixtures/identity --ignore-scripts --pack-destination .fixtures
          npm install ./.fixtures/treeseed-identity-0.1.0-rc.17.tgz --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          npm install --prefix tests/identity-runtime ./.fixtures/treeseed-identity-0.1.0-rc.17.tgz --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Build the Deployment implementation exercised by acceptance
        run: npm run build
      - run: node tests/identity-runtime/node_modules/playwright/cli.js install --with-deps chromium
      - name: Resolve disposable TLS names only on this ephemeral runner
        run: echo '127.0.0.1 sovereign.localhost central.localhost' | sudo tee -a /etc/hosts
      - run: npx tsc -p tests/identity-runtime/tsconfig.json
      - name: Verify published CLI and real OS custody with Keycloak
        run: sudo --preserve-env=GITHUB_ACTIONS,PLAYWRIGHT_BROWSERS_PATH "$(command -v node)" --import tsx tests/identity-runtime/verify.ts > identity-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-acceptance-${{ github.sha }}
          path: identity-acceptance.json
          retention-days: 14
          if-no-files-found: error
  postgres-bootstrap:
    # Host custody deliberately requires systemd >=259 (--refuse-null), matching
    # the supported Ubuntu 26.04 host, not the older browser-fixture runner.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Verify protected local bootstrap without a host TCP port
        run: sudo --preserve-env=GITHUB_ACTIONS "$(command -v node)" --import tsx tests/identity-runtime/local-bootstrap.ts > postgres-bootstrap-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-bootstrap-acceptance-${{ github.sha }}
          path: postgres-bootstrap-acceptance.json
          retention-days: 14
          if-no-files-found: error
