name: Publish protected Lab component

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated Deployment RC tag
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: "${{ inputs.tag }}", fetch-depth: 0 }
      - name: Require exact reviewed RC
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "${{ inputs.tag }}"
          test "$(git cat-file -t refs/tags/${{ inputs.tag }})" = tag
          git merge-base --is-ancestor HEAD origin/staging
          case "${{ inputs.tag }}" in *-rc.*) :;; *) exit 1;; esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run verify:direct
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { username: "${{ vars.TREESEED_DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - id: diagnostics
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with: { context: ., file: lab/diagnostics.Dockerfile, platforms: "linux/amd64,linux/arm64", push: true, tags: "treeseed/diagnostics:${{ inputs.tag }}", sbom: true, provenance: mode=max }
      - id: mailpit
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with: { context: ., file: lab/mailpit.Dockerfile, platforms: "linux/amd64,linux/arm64", push: true, tags: "treeseed/mailpit:${{ inputs.tag }}", sbom: true, provenance: mode=max }
      - name: Create exact component bundle
        env:
          TREESEED_DIAGNOSTICS_DIGEST: ${{ steps.diagnostics.outputs.digest }}
          TREESEED_MAILPIT_DIGEST: ${{ steps.mailpit.outputs.digest }}
        run: node --import tsx scripts/create-lab-release.ts
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with: { subject-path: "release/out/lab/*" }
      - name: Publish immutable Lab assets
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "${{ inputs.tag }}" release/out/lab/* --verify-tag --prerelease --generate-notes
