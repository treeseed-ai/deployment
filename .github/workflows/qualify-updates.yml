name: Qualify isolated update faults

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/manager/**'
      - 'src/supervisor/**'
      - 'tests/update-fault-qualification.test.ts'
      - '.github/workflows/qualify-updates.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run isolated manager fault matrix
        env:
          TREESEED_QUALIFICATION_EVIDENCE: update-fault-qualification.json
        run: npx vitest run tests/update-fault-qualification.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: update-fault-qualification
          path: update-fault-qualification.json
          if-no-files-found: error
          retention-days: 90
