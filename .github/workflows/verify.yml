name: Verify

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Hydrate exact SDK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdk_sha="$(node -e "const spec=require('./package.json').dependencies['@treeseed/sdk']; process.stdout.write(spec.match(/#([0-9a-f]{40})$/)?.[1] ?? '')")"
          test -n "$sdk_sha"
          run_id="$(gh run list --repo treeseed-ai/sdk --workflow verify.yml --commit "$sdk_sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p artifacts/sdk
          gh run download "$run_id" --repo treeseed-ai/sdk --name "sdk-${sdk_sha}" --dir artifacts/sdk
      - run: npm ci
      - name: Install sealed SDK artifact
        run: |
          sdk_archive="$(find artifacts/sdk -name '*.tgz' -type f -print -quit)"
          test -n "$sdk_archive"
          rm -rf node_modules/@treeseed/sdk
          mkdir -p node_modules/@treeseed/sdk
          tar -xzf "$sdk_archive" --strip-components=1 -C node_modules/@treeseed/sdk
      - run: npm run verify:direct
      - run: npm run verify:deb
        env:
          TREESEED_APT_SUITE: development
          TREESEED_INTEGRATION_RELEASES: tests/integration-locks/stable.json,tests/integration-locks/development.json
      - uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
      - run: syft dir:. -o spdx-json=release/out/deployment.spdx.json
      - name: Seal exact-head evidence
        run: printf '{"repository":"%s","commit":"%s","event":"%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" > release/out/exact-head.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-candidate-${{ github.sha }}
          path: release/out/**
          if-no-files-found: error
          retention-days: 14
  uninstall-vm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Hydrate exact SDK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdk_sha="$(node -e "const spec=require('./package.json').dependencies['@treeseed/sdk']; process.stdout.write(spec.match(/#([0-9a-f]{40})$/)?.[1] ?? '')")"
          test -n "$sdk_sha"
          run_id="$(gh run list --repo treeseed-ai/sdk --workflow verify.yml --commit "$sdk_sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p artifacts/sdk
          gh run download "$run_id" --repo treeseed-ai/sdk --name "sdk-${sdk_sha}" --dir artifacts/sdk
      - run: npm ci
      - name: Install sealed SDK artifact
        run: |
          sdk_archive="$(find artifacts/sdk -name '*.tgz' -type f -print -quit)"
          test -n "$sdk_archive"
          rm -rf node_modules/@treeseed/sdk
          mkdir -p node_modules/@treeseed/sdk
          tar -xzf "$sdk_archive" --strip-components=1 -C node_modules/@treeseed/sdk
      - name: Verify current and legacy uninstall on disposable VM
        run: sudo --preserve-env=GITHUB_ACTIONS,TREESEED_UNINSTALL_DISPOSABLE_VM "$(command -v node)" --import tsx scripts/verify-uninstall-vm.ts | tee uninstall-vm.json
        env:
          TREESEED_UNINSTALL_DISPOSABLE_VM: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uninstall-vm-${{ github.sha }}
          path: uninstall-vm.json
          if-no-files-found: error
          retention-days: 14
