name: Verify

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deployment-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@cbc03314871d271bce7275c5cee71d950397a0c3
        env:
          NODE_ENV: production
        with:
          github-token: ${{ github.token }}
      - name: Fetch digest-pinned disposable OpenBao
        shell: bash
        run: |
          custody_dir=$(mktemp -d)
          curl --fail --silent --show-error --location https://github.com/openbao/openbao/releases/download/v2.6.2/openbao_2.6.2_linux_amd64.tar.gz --output "$custody_dir/openbao.tar.gz"
          printf '8dc11cc5fca0b539a9e352727dacb4e2d304daffcf9a66e0718ac325a20d05aa  %s/openbao.tar.gz\n' "$custody_dir" | sha256sum --check --strict
          tar -xzf "$custody_dir/openbao.tar.gz" -C "$custody_dir" bao
          printf 'TREESEED_TEST_OPENBAO_BINARY=%s/bao\n' "$custody_dir" >> "$GITHUB_ENV"
      - name: Verify TLS custody against real OpenBao
        run: node --import tsx scripts/verify-secret-custody.ts | tee secret-custody.json
      - name: Verify core OpenBao bootstrap, restart and cold recovery
        run: node --import tsx scripts/verify-managed-openbao.ts | tee managed-openbao.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-custody-${{ github.sha }}
          path: |
            secret-custody.json
            managed-openbao.json
          if-no-files-found: error
          retention-days: 14
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@cbc03314871d271bce7275c5cee71d950397a0c3
        env:
          NODE_ENV: production
        with:
          github-token: ${{ github.token }}
      - run: npm prune --ignore-scripts --no-audit --no-fund --workspaces=false
      - name: Fetch exact existing Reviewer runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: treeseed-ai/reviewer
          ref: 62d261910f8bd157ba6575b185a586263dff8e44
          path: .treeseed/tools/reviewer
      - name: Install the executing Reviewer suite dependencies
        run: npm ci --prefix .treeseed/tools/reviewer --ignore-scripts --no-audit --no-fund
      - name: Measure the executing Reviewer prerequisite custody
        id: reviewer-prerequisites
        run: node --import ./.treeseed/tools/reviewer/node_modules/tsx/dist/loader.mjs .treeseed/tools/reviewer/scripts/scene-action-prerequisites.ts
      - name: Install Reviewer native prerequisite toolchain
        if: steps.reviewer-prerequisites.outputs.toolchain-ready != 'true'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.18"
          elixir-version: "1.17.3"
      - name: Install the executing Reviewer exact SDK artifact
        uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@8702e0285622276d850250a5f8637b6d704318d1
        env:
          NODE_ENV: production
        with:
          github-token: ${{ github.token }}
          commit: ${{ steps.reviewer-prerequisites.outputs.sdk-commit }}
          paths: .treeseed/tools/reviewer/node_modules/@treeseed/sdk
      - name: Build the executing Reviewer archive assets
        run: npm run --prefix .treeseed/tools/reviewer build:dist
      - name: Build original capacity host installer
        run: npm run build:deb
        env:
          TREESEED_APT_SUITE: development
          TREESEED_INTEGRATION_RELEASES: https://raw.githubusercontent.com/treeseed-ai/platform/be36cd24299c0381a4e1c81c420823f6340ca136/config/integrations/stable.release.json,https://raw.githubusercontent.com/treeseed-ai/platform/be36cd24299c0381a4e1c81c420823f6340ca136/config/integrations/development.release.json
      - name: Initialize disposable native capacity host
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_REPOSITORY,GITHUB_WORKSPACE,TREESEED_PRIVILEGED_CACHE_TESTS,PATH "$(command -v node)" --import tsx scripts/verify-native-host.ts
        env:
          TREESEED_PRIVILEGED_CACHE_TESTS: '1'
      - name: Prepare native development image before timed tests
        run: |
          node node_modules/tsx/dist/cli.mjs --eval '
            import {execFileSync} from "node:child_process";
            import {resolveDevelopmentRuntimeImage} from "./src/supervisor/development-container.ts";
            const image="mirror.gcr.io/library/node@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd";
            const docker=(args:readonly string[])=>execFileSync("/usr/bin/docker",[...args],{encoding:"utf8",stdio:["ignore","pipe","pipe"]});
            docker(["pull","--quiet",image]);
            const expected=docker(["image","inspect",image,"--format","{{.Id}}"]).trim();
            docker(["tag",image,"node:24-bookworm-slim"]);
            const resolved=resolveDevelopmentRuntimeImage((_executable:string,args:readonly string[])=>docker(args));
            if(resolved!==expected)throw new Error("Native development image readback differs from its held manifest.");
          '
      - name: Reproduce public host inspection before the complete native suites
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE,TREESEED_PRIVILEGED_CACHE_TESTS,PATH "$(command -v node)" node_modules/vitest/vitest.mjs run tests/sandbox-host-inspection-native.test.ts
        env:
          TREESEED_PRIVILEGED_CACHE_TESTS: '1'
      - run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE,TREESEED_PRIVILEGED_CACHE_TESTS,PATH bash -euo pipefail -c 'npm run verify:direct'
        env:
          TREESEED_PRIVILEGED_CACHE_TESTS: '1'
      - name: Execute coded sandbox component scenes
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,TREESEED_PRIVILEGED_CACHE_TESTS,PATH "$(command -v node)" --import ./.treeseed/tools/reviewer/node_modules/tsx/dist/loader.mjs \
            .treeseed/tools/reviewer/src/verifiers/guarantees/command.ts \
            --workspace "$GITHUB_WORKSPACE" --environment local --ids guarantee.deployment.golden.component-boundaries \
            --run-id "actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        env:
          TREESEED_PRIVILEGED_CACHE_TESTS: '1'
      - name: Retain coded scene evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: .treeseed/guarantees/runs/actions-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - run: npm run verify:deb
        env:
          TREESEED_APT_SUITE: development
          TREESEED_INTEGRATION_RELEASES: tests/integration-locks/stable.json,tests/integration-locks/development.json
      - uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
      - run: syft dir:. -o spdx-json=release/out/deployment.spdx.json
      - name: Seal exact-head evidence
        run: printf '{"repository":"%s","commit":"%s","event":"%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" > release/out/exact-head.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-candidate-${{ github.sha }}
          path: release/out/**
          if-no-files-found: error
          retention-days: 14
  uninstall-vm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - uses: treeseed-ai/sdk/.github/actions/install-exact-sdk@cbc03314871d271bce7275c5cee71d950397a0c3
        env:
          NODE_ENV: production
        with:
          github-token: ${{ github.token }}
      - name: Verify current and legacy uninstall on disposable VM
        run: sudo --preserve-env=GITHUB_ACTIONS,TREESEED_UNINSTALL_DISPOSABLE_VM "$(command -v node)" --import tsx scripts/verify-uninstall-vm.ts | tee uninstall-vm.json
        env:
          TREESEED_UNINSTALL_DISPOSABLE_VM: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uninstall-vm-${{ github.sha }}
          path: uninstall-vm.json
          if-no-files-found: error
          retention-days: 14
