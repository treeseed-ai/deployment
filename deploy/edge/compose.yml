name: treeseed-edge
services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/treeseed/edge/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - /etc/treeseed/edge:/etc/treeseed/edge:ro
      - /run/treeseed/manager:/run/treeseed/manager:ro
    networks: [treeseed-edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/treeseed/edge/Caddyfile", "--adapter", "caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
networks:
  treeseed-edge:
    name: treeseed-edge
    external: true
