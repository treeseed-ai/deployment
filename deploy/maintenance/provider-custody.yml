name: treeseed-provider-custody
services:
  inventory: &observer
    image: treeseed/agent-manager@sha256:a64e0a60e2edc6abb2a3a4052e7ae8ccc792a3c5307444bf208e586283b4b4bf
    user: "65532:65532"
    entrypoint: [node, /app/maintenance/scripts/maintenance/host-provider-custody.js]
    command: [inventory]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:19843:19843"]
    volumes: &maintenance-volumes
      - { type: bind, source: "${TREESEED_COMPONENT_DATA_ROOT:?required}", target: /data }
      - { type: bind, source: /etc/treeseed/components/agent/treeseed.capacity-provider.yaml, target: /config/provider.yaml, read_only: true }
      - { type: bind, source: /usr/share/treeseed/components/provider-custody-maintenance/payload, target: /app/maintenance, read_only: true }
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:19843/status').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 3s
      retries: 10
  convert: &conversion
    image: treeseed/agent-manager@sha256:a64e0a60e2edc6abb2a3a4052e7ae8ccc792a3c5307444bf208e586283b4b4bf
    user: "65532:65532"
    entrypoint: [node, /app/maintenance/scripts/maintenance/host-provider-custody.js]
    command: [convert]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - { type: bind, source: "${TREESEED_COMPONENT_DATA_ROOT:?required}", target: /data }
      - { type: bind, source: /etc/treeseed/components/agent/treeseed.capacity-provider.yaml, target: /config/provider.yaml, read_only: true }
      - { type: bind, source: /usr/share/treeseed/components/provider-custody-maintenance/payload, target: /app/maintenance, read_only: true }
      - { type: bind, source: /run/treeseed/component-credentials/agent/credentials, target: /run/provider-key, read_only: true }
  accept:
    <<: *observer
    ports: []
    depends_on:
      convert: {condition: service_completed_successfully}
  recover:
    <<: *conversion
    command: [convert-retired-development-v1]
  accept-recovery:
    <<: *observer
    ports: []
    depends_on:
      recover: {condition: service_completed_successfully}
networks:
  private: {internal: true}
