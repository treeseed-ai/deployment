schemaVersion: treeseed.package/v1
project:
  slug: deployment
  repository: treeseed-ai/deployment
  visibility: public
runtime:
  contract: treeseed.package-runtime/v1
  components:
    - manager
    - edge
    - lab
  endpoints:
    - id: manager-api
      service: manager
      protocol: https
      port: 4790
      visibility: host
      defaultAlias: manager.treeseed.localhost
      aliasOverride: false
      tls: passthrough
      authentication: mtls
      healthGate:
        protocol: https
        path: /v1/health
        timeoutSeconds: 30
    - id: lab-mail
      service: mailpit
      protocol: http
      port: 8025
      visibility: host
      defaultAlias: mail.treeseed.localhost
      aliasOverride: true
      tls: edge
      authentication: none
      healthGate:
        protocol: http
        path: /api/v1/info
        timeoutSeconds: 30
release:
  aptOrigin: TreeSeed Deployment
  suites:
    - stable
    - development
  hostArchitectures:
    - amd64
  imagePlatforms:
    - linux/amd64
    - linux/arm64
development:
  schemaVersion: treeseed.development-runtime/v1
  project: { id: deployment, repository: treeseed-ai/deployment }
  defaults: { leaseSeconds: 14400, restoreOnFailure: true }
  targets:
    - id: package
      kind: package-watch
      platforms: [linux-amd64, linux-arm64, darwin-arm64, darwin-amd64]
      runtimeRequirements: [node>=22]
      sourceRoots: [src, scripts/development, package.json, tsconfig.json]
      ignoredPaths: [dist, node_modules]
      operations:
        watch: { command: node, args: [--watch-path=src, --watch-path=package.json, --import, tsx, scripts/development/build-watch.ts], environment: {}, timeoutSeconds: 86400 }
        build: { command: node, args: [--import, tsx, scripts/development/build-watch.ts], environment: {}, timeoutSeconds: 900 }
        verify: { command: npm, args: [test], environment: {}, timeoutSeconds: 1800 }
      ready: { kind: marker, path: dist/.treeseed-build-complete.json, timeoutSeconds: 120 }
      outputs: [{ path: dist, mediaType: application/vnd.treeseed.node-package, completionMarker: dist/.treeseed-build-complete.json, digestAlgorithm: sha256 }]
      endpoints: []
      dependencies: [{ id: sdk, target: package, locality: local, reaction: rebuild }]
      statePolicy: stateless
      migrationPolicy: none
      secretRefs: {}
      shutdown: { graceSeconds: 10, activeWorkPolicy: block }
      resources: {}
      logs: [.treeseed/development/package.log]
      forbiddenOperations: [publish, production-tag]
      promotion: { liveAdmissible: false, candidateRequiresVerification: true }
