schemaVersion: treeseed.package/v1
project:
  slug: deployment
  repository: treeseed-ai/deployment
  visibility: public
runtime:
  contract: treeseed.package-runtime/v1
  components:
    - manager
    - edge
    - lab
  endpoints:
    - id: manager-api
      service: manager
      protocol: https
      port: 4790
      visibility: host
      defaultAlias: manager.treeseed.localhost
      aliasOverride: false
      tls: passthrough
      authentication: mtls
      healthGate:
        protocol: https
        path: /v1/health
        timeoutSeconds: 30
    - id: lab-mail
      service: mailpit
      protocol: http
      port: 8025
      visibility: host
      defaultAlias: mail.treeseed.localhost
      aliasOverride: true
      tls: edge
      authentication: none
      healthGate:
        protocol: http
        path: /api/v1/info
        timeoutSeconds: 30
release:
  aptOrigin: TreeSeed Deployment
  suites:
    - stable
    - development
  hostArchitectures:
    - amd64
  imagePlatforms:
    - linux/amd64
    - linux/arm64
